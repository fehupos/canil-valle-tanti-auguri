<!DOCTYPE html>

<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FBF9F5', 100: '#FAF7F2', 200: '#EBE4D8', 300: '#D5C7B3', 400: '#90A0B8',
              500: '#4A6282', 600: '#2A4063', 700: '#182C48', 800: '#0E1C30', 900: '#07101C'
            }
          },
          fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFBF7; color: #2E1A0E; }
    .font-serif { font-family: 'Cinzel', serif; }
    .header-logo-strip { transition: height 300ms ease, border-width 300ms ease; }
    #header-logo {
      position: absolute; z-index: 50; top: 0; left: 50%; transform: translateX(-50%);
      width: min(90vw, 272px); height: 136px; overflow: hidden;
      transition: top 300ms ease, left 300ms ease, width 300ms ease, height 300ms ease, transform 300ms ease;
    }
    @media (min-width: 640px) { #header-logo { width: 160px; height: 80px; } }
    #header-logo img {
      width: 100%; height: 100%; object-fit: contain; object-position: center;
      transform: scale(1.4); transform-origin: center; mix-blend-mode: multiply; opacity: .9;
      transition: transform 300ms ease, filter 300ms ease, opacity 300ms ease;
    }
    @media (min-width: 640px) { #header-logo img { transform: scale(2); } }
    .site-main { transition: padding-top 300ms ease; }
    #site-header.is-scrolled + .site-main { padding-top: 57px; }
    #site-header.is-scrolled .header-logo-strip { height: 0; border-bottom-width: 0; }
    #site-header.is-scrolled #header-logo {
      top: 4px; left: max(calc((100vw - 80rem) / 2 + 1rem), 1rem); width: 104px; height: 52px; transform: none;
    }
    #site-header.is-scrolled #header-logo img { transform: scale(2); filter: brightness(0) invert(1); mix-blend-mode: normal; opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .header-logo-strip, #header-logo, #header-logo img { transition-duration: .01ms; }
    }
    .blog-prose h2 { font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; margin: 1.75rem 0 .75rem; color: #07101C; }
    .blog-prose h3 { font-size: 1.15rem; font-weight: 700; margin: 1.25rem 0 .5rem; color: #0E1C30; }
    .blog-prose p { margin: 0 0 1rem; line-height: 1.8; }
    .blog-prose ul { list-style: disc; padding-left: 1.5rem; margin: 0 0 1rem; }
    .blog-prose ol { list-style: decimal; padding-left: 1.5rem; margin: 0 0 1rem; }
    .blog-prose a { color: #2A4063; text-decoration: underline; }
    .blog-prose img { max-width: 100%; height: auto; border-radius: .75rem; margin: 1rem 0; }
    .blog-prose blockquote { border-left: 4px solid #D5C7B3; padding-left: 1rem; color: #4A6282; margin: 1rem 0; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

  <header id="site-header" class="fixed top-0 left-0 w-full z-40 bg-brand-800 border-b border-brand-700">
    <div class="header-logo-strip h-[136px] border-b border-brand-200 bg-white sm:h-20"></div>
    <a id="header-logo" href="/">
      <img src="https://lhinolmdpaonyuxbgzbw.supabase.co/storage/v1/object/public/puppy-photos/site/2.svg" alt="Logomarca Oficial Canil Valle Tanti Auguri" class="block h-full w-full">
    </a>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center">
      <nav class="hidden lg:flex items-center gap-5 xl:gap-8 text-xs xl:text-sm font-semibold text-white col-start-2 row-start-1 justify-self-center">
        <a href="/blog" class="hover:text-brand-200 transition-colors">Blog</a>
        <a href="/blog?cat=a-raca" class="hover:text-brand-200 transition-colors">A Raça</a>
        <a href="/blog?cat=treinamento" class="hover:text-brand-200 transition-colors">Treinamento</a>
        <a href="/blog?cat=saude" class="hover:text-brand-200 transition-colors">Saúde</a>
      </nav>
      <div class="hidden lg:flex items-center gap-3 col-start-3 row-start-1 justify-self-end">
        <a href="/" class="px-3.5 py-2 text-xs font-semibold text-white border border-white/40 rounded-lg hover:bg-white/10 transition-colors flex items-center gap-2">
          <i class="fa-solid fa-arrow-left"></i> Voltar ao site
        </a>
        <a href="https://wa.me/5511913153403?text=Olá!+Vim+pelo+blog+e+gostaria+de+falar+sobre+os+Chihuahuas+Valle+Tanti+Auguri" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-[#25D366] hover:bg-[#1FAE55] text-white rounded-lg text-xs font-bold transition-all shadow-md flex items-center gap-2">
          <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
        </a>
      </div>
      <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" aria-label="Abrir menu" class="lg:hidden col-start-3 row-start-1 justify-self-end text-white p-2 text-xl focus:outline-none">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
    <div id="mobile-menu" class="hidden lg:hidden bg-brand-800 border-b border-brand-700 px-6 py-4 space-y-3">
      <a href="/blog" class="block text-white font-medium hover:text-brand-200">Blog</a>
      <a href="/blog?cat=a-raca" class="block text-white font-medium hover:text-brand-200">A Raça</a>
      <a href="/blog?cat=treinamento" class="block text-white font-medium hover:text-brand-200">Treinamento</a>
      <a href="/blog?cat=saude" class="block text-white font-medium hover:text-brand-200">Saúde</a>
      <a href="/" class="block text-white font-medium hover:text-brand-200">Voltar ao site</a>
    </div>
  </header>

  <main id="blog-root" class="site-main pt-[193px] sm:pt-[137px]"></main>

  <footer class="bg-brand-900 text-brand-400 text-xs py-6 border-t border-brand-800 text-center">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 Canil Valle Tanti Auguri - Todos os direitos reservados. Especialistas em Chihuahua.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    // Somente leitura: usa apenas a chave pública, sem login.
    const SUPABASE_REST = 'https://lhinolmdpaonyuxbgzbw.supabase.co/rest/v1';
    const SUPABASE_KEY = 'sb_publishable_VOxqH2mDGhJBzzN-qGpETg_QNkInRzy';
    const PAGE_SIZE = 6;
    const CATEGORIES = { 'a-raca': 'A Raça', treinamento: 'Treinamento', saude: 'Saúde' };
    const FALLBACK_COVER = 'https://images.unsplash.com/photo-1591824438708-ce405f36ba3d?auto=format&fit=crop&w=800&q=80';
    const root = document.getElementById('blog-root');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const [year, month, day] = dateStr.split('T')[0].split('-');
      return `${day}/${month}/${year}`;
    }

    function excerptOf(post) {
      if (post.excerpt) return post.excerpt;
      const plain = (post.content || '')
        .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
        .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
        .replace(/[#>*_`~\-]+/g, ' ').replace(/\s+/g, ' ').trim();
      return plain.length > 160 ? `${plain.slice(0, 160).trim()}...` : plain;
    }

    async function api(query) {
      const response = await fetch(`${SUPABASE_REST}/${query}`, {
        headers: { apikey: SUPABASE_KEY, Accept: 'application/json' }
      });
      if (!response.ok) throw new Error(`Erro ${response.status}`);
      return response.json();
    }

    function postCard(post) {
      return `
        <a href="/blog/${encodeURIComponent(post.slug)}" class="bg-white rounded-2xl overflow-hidden border border-brand-300 shadow-sm hover:shadow-lg transition-all flex flex-col group">
          <div class="relative overflow-hidden">
            <img src="${escapeHtml(post.cover_image || FALLBACK_COVER)}" alt="${escapeHtml(post.title)}" loading="lazy" class="aspect-[4/3] w-full object-cover group-hover:scale-105 transition-transform duration-500">
            <span class="absolute bottom-3 left-3 bg-brand-900/80 text-white text-[10px] px-2.5 py-1 rounded-md font-semibold">${escapeHtml(formatDate(post.published_at))}</span>
          </div>
          <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
            <div>
              <span class="text-[10px] font-bold text-brand-600 uppercase tracking-widest">${escapeHtml(CATEGORIES[post.category] || '')}</span>
              <h3 class="font-serif font-bold text-lg text-brand-900 mb-2">${escapeHtml(post.title)}</h3>
              <p class="text-xs text-brand-700 leading-relaxed line-clamp-3">${escapeHtml(excerptOf(post))}</p>
            </div>
            <span class="w-full py-2 bg-brand-800 group-hover:bg-brand-900 text-white text-xs font-bold rounded-lg text-center transition-colors">Leia mais</span>
          </div>
        </a>`;
    }

    function pageUrl(cat, page) {
      const params = new URLSearchParams();
      if (cat) params.set('cat', cat);
      if (page > 1) params.set('page', page);
      const qs = params.toString();
      return `/blog${qs ? `?${qs}` : ''}`;
    }

    async function renderList() {
      const params = new URLSearchParams(location.search);
      const cat = CATEGORIES[params.get('cat')] ? params.get('cat') : '';
      const page = Math.max(1, parseInt(params.get('page'), 10) || 1);
      document.title = `${cat ? `${CATEGORIES[cat]} | ` : ''}Blog | Canil Valle Tanti Auguri`;

      root.innerHTML = `
        <section class="bg-brand-800 py-14 text-center text-white">
          <div class="max-w-3xl mx-auto px-4">
            <h1 class="font-serif text-4xl sm:text-5xl font-bold">Blog Valle Tanti Auguri</h1>
            <p class="mt-4 text-sm sm:text-base text-brand-200 leading-relaxed">Conteúdo sobre a raça Chihuahua, treinamento e saúde para você cuidar bem do seu companheiro.</p>
          </div>
        </section>
        <section class="py-10">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-[18rem_minmax(0,1fr)] gap-8">
            <aside class="space-y-6">
              <div class="bg-white rounded-2xl border border-brand-200 p-5">
                <h2 class="font-serif font-bold text-lg text-brand-900 mb-3">Últimas postagens</h2>
                <div id="latest-list" class="space-y-3 text-xs text-brand-600">Carregando...</div>
              </div>
              <div class="bg-white rounded-2xl border border-brand-200 p-5">
                <h2 class="font-serif font-bold text-lg text-brand-900 mb-3">Categorias</h2>
                <ul class="space-y-2 text-sm font-semibold text-brand-700">
                  <li><a class="hover:text-brand-900 ${cat ? '' : 'underline'}" href="/blog">Todas</a></li>
                  ${Object.entries(CATEGORIES).map(([key, label]) => `<li><a class="hover:text-brand-900 ${cat === key ? 'underline' : ''}" href="/blog?cat=${key}">${label}</a></li>`).join('')}
                </ul>
              </div>
            </aside>
            <div>
              <div id="posts-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-8"></div>
              <nav id="posts-pagination" aria-label="Paginação" class="mt-8"></nav>
            </div>
          </div>
        </section>`;

      try {
        const filter = cat ? `&category=eq.${cat}` : '';
        const offset = (page - 1) * PAGE_SIZE;
        const [rows, latest] = await Promise.all([
          fetch(`${SUPABASE_REST}/posts?select=id,title,slug,excerpt,content,cover_image,category,published_at&published=eq.true${filter}&order=published_at.desc&limit=${PAGE_SIZE}&offset=${offset}`, {
            headers: { apikey: SUPABASE_KEY, Prefer: 'count=exact', Accept: 'application/json' }
          }).then(async response => {
            if (!response.ok) throw new Error(`Erro ${response.status}`);
            const total = Number((response.headers.get('Content-Range') || '').split('/')[1]) || 0;
            return { items: await response.json(), total };
          }),
          api('posts?select=title,slug,cover_image,published_at&published=eq.true&order=published_at.desc&limit=5')
        ]);

        document.getElementById('latest-list').innerHTML = latest.length ? latest.map(post => `
          <a href="/blog/${encodeURIComponent(post.slug)}" class="flex gap-3 items-center group">
            <img src="${escapeHtml(post.cover_image || FALLBACK_COVER)}" alt="" loading="lazy" class="w-14 h-14 rounded-lg object-cover border border-brand-200 shrink-0">
            <span><span class="block text-sm font-bold text-brand-900 group-hover:underline">${escapeHtml(post.title)}</span><span class="text-[11px] text-brand-600">${escapeHtml(formatDate(post.published_at))}</span></span>
          </a>`).join('') : 'Nenhuma postagem ainda.';

        const grid = document.getElementById('posts-grid');
        if (!rows.items.length) {
          grid.innerHTML = '<p class="col-span-full text-center py-12 bg-white rounded-2xl border border-brand-200 text-sm font-bold text-brand-800">Nenhuma postagem encontrada.</p>';
          return;
        }
        grid.innerHTML = rows.items.map(postCard).join('');

        const totalPages = Math.ceil(rows.total / PAGE_SIZE);
        if (totalPages > 1) {
          const btn = 'rounded-lg border border-brand-300 bg-white px-4 py-2 text-xs font-bold text-brand-800 hover:bg-brand-100';
          document.getElementById('posts-pagination').innerHTML = `
            <div class="flex items-center justify-center gap-3">
              ${page > 1 ? `<a class="${btn}" href="${pageUrl(cat, page - 1)}">Anterior</a>` : ''}
              <span class="text-xs font-semibold text-brand-800">Página ${page} de ${totalPages}</span>
              ${page < totalPages ? `<a class="${btn}" href="${pageUrl(cat, page + 1)}">Próxima</a>` : ''}
            </div>`;
        }
      } catch {
        document.getElementById('posts-grid').innerHTML = '<p class="col-span-full text-center py-12 bg-white rounded-2xl border border-brand-200 text-sm font-bold text-red-700">Não foi possível carregar as postagens.</p>';
        document.getElementById('latest-list').textContent = '';
      }
    }

    function renderNotFound() {
      document.title = 'Postagem não encontrada | Canil Valle Tanti Auguri';
      root.innerHTML = `
        <section class="py-24 text-center px-4">
          <h1 class="font-serif text-3xl font-bold text-brand-900">Postagem não encontrada</h1>
          <p class="mt-3 text-sm text-brand-700">O endereço pode estar incorreto ou a postagem foi removida.</p>
          <a href="/blog" class="inline-block mt-6 px-6 py-3 bg-brand-800 hover:bg-brand-900 text-white text-sm font-bold rounded-xl">Voltar ao blog</a>
        </section>`;
    }

    function setMeta(selector, value) {
      document.querySelector(selector)?.setAttribute('content', value);
    }

    async function renderArticle(slug) {
      root.innerHTML = '<p class="py-24 text-center text-sm text-brand-600">Carregando...</p>';
      let post;
      try {
        const rows = await api(`posts?select=*&slug=eq.${encodeURIComponent(slug)}&published=eq.true&limit=1`);
        post = rows[0];
      } catch {
        post = null;
      }
      if (!post) return renderNotFound();

      const description = excerptOf(post);
      document.title = `${post.title} | Canil Valle Tanti Auguri`;
      setMeta('meta[name="description"]', description);
      setMeta('meta[property="og:title"]', post.title);
      setMeta('meta[property="og:description"]', description);

      const url = location.href.split('#')[0];
      const shareText = encodeURIComponent(`${post.title} ${url}`);
      const category = CATEGORIES[post.category] || '';
      const html = DOMPurify.sanitize(marked.parse(post.content || ''));

      root.innerHTML = `
        <article class="max-w-3xl mx-auto px-4 py-10">
          <nav aria-label="Caminho" class="text-xs text-brand-600 mb-4 flex flex-wrap gap-1">
            <a href="/blog" class="hover:underline">Blog</a><span>›</span>
            <a href="/blog?cat=${escapeHtml(post.category)}" class="hover:underline">${escapeHtml(category)}</a><span>›</span>
            <span class="text-brand-900 font-semibold">${escapeHtml(post.title)}</span>
          </nav>
          <h1 class="font-serif text-3xl sm:text-4xl font-bold text-brand-900">${escapeHtml(post.title)}</h1>
          <p class="mt-2 text-xs font-bold text-brand-600 uppercase tracking-widest">${escapeHtml(formatDate(post.published_at))}</p>
          ${post.subtitle ? `<h2 class="mt-4 text-lg sm:text-xl text-brand-700 font-semibold">${escapeHtml(post.subtitle)}</h2>` : ''}
          ${post.cover_image ? `<img src="${escapeHtml(post.cover_image)}" alt="${escapeHtml(post.title)}" class="mt-6 w-full aspect-[4/3] sm:aspect-[16/9] object-cover rounded-2xl border border-brand-200">` : ''}
          <div class="blog-prose mt-8 text-base text-brand-800">${html}</div>

          <div class="mt-10 pt-6 border-t border-brand-200">
            <p class="text-xs font-bold text-brand-800 mb-3">Compartilhe</p>
            <div class="flex flex-wrap gap-2">
              <a href="https://wa.me/?text=${shareText}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-[#25D366] hover:bg-[#1FAE55] text-white rounded-lg text-xs font-bold flex items-center gap-2"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
              <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-[#1877F2] hover:bg-[#1666d6] text-white rounded-lg text-xs font-bold flex items-center gap-2"><i class="fa-brands fa-facebook-f"></i> Facebook</a>
              <button type="button" id="copy-link" class="px-4 py-2 border border-brand-300 text-brand-800 hover:bg-brand-100 rounded-lg text-xs font-bold flex items-center gap-2"><i class="fa-solid fa-link"></i> <span>Copiar link</span></button>
            </div>
          </div>

          <div class="mt-10 rounded-2xl bg-brand-800 text-white p-6 text-center">
            <p class="font-serif text-xl font-bold">Conheça nossos filhotes</p>
            <a href="/#filhotes" class="inline-block mt-4 px-6 py-3 bg-white text-brand-800 text-sm font-bold rounded-xl hover:bg-brand-100">Ver filhotes disponíveis</a>
          </div>

          <section id="related" class="mt-12 hidden">
            <h2 class="font-serif text-2xl font-bold text-brand-900 mb-4">Posts relacionados</h2>
            <div id="related-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6"></div>
          </section>
        </article>`;

      document.getElementById('copy-link').addEventListener('click', async event => {
        const label = event.currentTarget.querySelector('span');
        try {
          await navigator.clipboard.writeText(url);
          label.textContent = 'Link copiado!';
        } catch {
          label.textContent = 'Não foi possível copiar';
        }
      });

      try {
        const related = await api(`posts?select=id,title,slug,excerpt,content,cover_image,category,published_at&published=eq.true&category=eq.${post.category}&id=neq.${post.id}&order=published_at.desc&limit=2`);
        if (related.length) {
          document.getElementById('related-grid').innerHTML = related.map(postCard).join('');
          document.getElementById('related').classList.remove('hidden');
        }
      } catch { /* relacionados são opcionais */ }
    }

    function route() {
      const slug = decodeURIComponent(location.pathname.replace(/^\/blog(\.html)?\/?/, '').split('/')[0] || '');
      if (slug) renderArticle(slug);
      else renderList();
    }

    function updateHeaderOnScroll() {
      document.getElementById('site-header').classList.toggle('is-scrolled', window.scrollY > 24);
    }
    window.addEventListener('scroll', updateHeaderOnScroll, { passive: true });
    updateHeaderOnScroll();
    route();
  </script>
</body>
</html>
